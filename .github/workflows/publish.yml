name: CD

# 发布流程（CD）。两种触发：
#   1. push 到 master：package.json 的版本号若还没发布过，就跑门禁 → 发 npm → 打 tag、建 Release；
#      版本号没动（普通合并）则整条流程跳过，是一次绿色的空跑。
#   2. 手动触发：用于演练（dry_run）或失败重试；仍只允许从 master 运行。
#
# 闸门是「版本号必须前进」：npm 同名版本一旦发布就**不能覆盖**，只能 deprecate，
# 这是整条链上唯一不可回滚的动作。所以合入 master 不会误发——只有先在 PR 里改掉
# package.json 的 version，再合入，CD 才会真的发布。发布前重跑与 CI 相同的三条门禁。
#
# 前置（只需配置一次，在 npmjs.com 包设置里）：
#   把本仓库的 .github/workflows/publish.yml 登记为 Trusted Publisher，之后靠 OIDC 换临时凭证，
#   仓库里不需要存 NPM_TOKEN。
#   注意：Trusted Publisher 认的是这个文件名，改名会让发布认证失败。

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练：跑全部门禁并核对版本，但不发布、不建 Release'
        type: boolean
        default: false

permissions:
  contents: write   # 建 tag 与 GitHub Release
  id-token: write   # npm Trusted Publishing（OIDC）

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 手动触发时 GitHub 允许选分支；从非 master 发版会把「那个分支的版本」发出去。
      - name: Guard — manual runs must use master
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::发布只允许在 master 上触发（当前 ${GITHUB_REF}）。请在 Run workflow 里把 Use workflow from 选成 master。"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 需要 tag 历史来生成 Release notes

      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # 发布构建永远不缓存

      # npm >= 11.5.1 才支持 OIDC 自动换取发布凭证
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest

      # 发布前必须再跑一遍与 CI 相同的门禁：不允许在审计不通过时发布
      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test
        env:
          TZ: UTC

      - name: Quality gate audit
        run: npm run audit

      - name: Guard — package must be publishable
        run: |
          node -e "
            const pkg = require('./package.json')
            if (pkg.private === true) {
              console.error('::error::package.json 还是 private: true，npm 会拒绝发布。')
              process.exit(1)
            }
            if (!pkg.name || pkg.name.startsWith('@local/')) {
              console.error('::error::包名 ' + pkg.name + ' 不是可发布的 npm 名，先完成改名再发。')
              process.exit(1)
            }
            if (!pkg.license) {
              console.error('::error::package.json 缺少 license 字段。')
              process.exit(1)
            }
            console.log('package OK: ' + pkg.name + '@' + pkg.version)
          "

      # CD 的闸门：版本号必须前进。普通合并没改版本号，这里跳过发布但不让流程变红。
      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME}/${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} 已在 npm 上，这次没有推进版本号。"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "::error::${VERSION} 已经发布过，没有可发的新版本。请先把 package.json 的 version 前进再触发。"
              exit 1
            fi
            echo "### CD 跳过：${NAME}@${VERSION} 已在 npm 上，这次合并没有推进版本号。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 版本没发过，但 tag 已经在：说明上一次发布只完成了一半，交给人确认。
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} 已存在，但 npm 上没有这个版本；状态不一致，请人工确认后再发。"
            exit 1
          fi
          echo "${NAME}@${VERSION} 尚未发布，继续。"

      - name: Publish to npm
        if: steps.version.outputs.skip == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: npm publish --access public

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## What's Changed"
            echo
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --format='- %s' "${PREV_TAG}..HEAD" | head -100
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${VERSION}"
            else
              git log --no-merges --format='- %s' | head -100
            fi
          } > release_notes.md
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file release_notes.md

      - name: Dry-run summary
        if: steps.version.outputs.skip == 'false' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "### 演练结束（未发布、未建 Release）" >> "$GITHUB_STEP_SUMMARY"
          echo "版本 ${{ steps.version.outputs.version }} 通过全部门禁，正式发布请去掉 dry_run 再跑一次，或直接合入 master。" >> "$GITHUB_STEP_SUMMARY"
