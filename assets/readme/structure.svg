<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1200" height="494" viewBox="0 0 1200 494" role="img" aria-labelledby="struct-title struct-desc">
  <title id="struct-title">dsh-timespan Bundle 结构</title>
  <desc id="struct-desc">包清单与加载补丁连接 DSH Host 和 Web Client 两个入口。Host 使用八个领域模块处理统计和计时，六个适配模块处理 RPC、回顾、命令与只读工具。Client 挂载侧栏、全局浮层、仪表盘与设置。仓库还包括测试、架构决策、双语元数据和 README 配图。</desc>

  <defs>
    <linearGradient id="timespan-accent" x2="0" y2="1">
      <stop stop-color="#4A9EFF"/><stop offset=".58" stop-color="#5D8BF4"/><stop offset="1" stop-color="#8A6CE8"/>
    </linearGradient>
    <g id="timespan-mark" fill="#30302b">
      <path d="M9 2.75H6.75A4.75 4.75 0 0 0 2 7.5v9a4.75 4.75 0 0 0 4.75 4.75H9q.4 0 .4-.4v-2.3q0-.4-.4-.4H6.95a1.85 1.85 0 0 1-1.85-1.85V7.7a1.85 1.85 0 0 1 1.85-1.85H9q.4 0 .4-.4v-2.3q0-.4-.4-.4Z"/>
      <path d="M9 2.75H6.75A4.75 4.75 0 0 0 2 7.5v9a4.75 4.75 0 0 0 4.75 4.75H9q.4 0 .4-.4v-2.3q0-.4-.4-.4H6.95a1.85 1.85 0 0 1-1.85-1.85V7.7a1.85 1.85 0 0 1 1.85-1.85H9q.4 0 .4-.4v-2.3q0-.4-.4-.4Z" transform="translate(24) scale(-1 1)" fill="url(#timespan-accent)"/>
      <path d="M6.1 13.05q0-.45.45-.59l7.98-2.57q.33-.11.19.21l-.63 1.58q-.13.33-.46.44l-6.88 2.21q-.65.21-.65-.44Z"/>
      <path d="M15.49 9.94q.1-.26.37-.35l1.54-.49q.7-.22.7.52v.81q0 .45-.44.59l-2.54.81q-.29.09-.17-.2Z" fill="url(#timespan-accent)"/>
    </g>
  </defs>

  <rect width="1200" height="494" rx="24" fill="#ffffff"/>
  <rect x="0.75" y="0.75" width="1198.5" height="492.5" rx="23.25" fill="none" stroke="#dedfdd" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- 眉题 -->
    <g transform="translate(72 40)">
      <use href="#timespan-mark" transform="translate(0 -2)"/>
      <text x="34" y="17" font-size="26" font-weight="700" fill="#181a1c">Bundle 结构</text>
      <text x="1056" y="16" text-anchor="end" font-size="18" fill="#606568"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">@qwayo/dsh-timespan</text>
    </g>

    <!-- ===== 第一层：bundle 清单 ===== -->
    <g id="root-row">
      <rect x="72" y="66" width="500" height="56" rx="12" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="88" y="101" font-size="20" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">package.json</text>
      <text x="260" y="100" font-size="18" fill="#42494e">Bundle 清单与加载方式</text>

      <rect x="628" y="66" width="500" height="56" rx="12" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="644" y="101" font-size="20" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">cordis.patch.yml</text>
      <text x="852" y="100" font-size="18" fill="#42494e">向 Loader 插入插件行</text>
    </g>

    <!-- 连接线：bundle → 两半 -->
    <path d="M322 122 V136 M878 122 V136 M322 136 H878 M322 136 V154 M878 136 V154"
          fill="none" stroke="#1f4e94" stroke-width="1.5"/>

    <!-- ===== 第二层：两半入口 ===== -->
    <g id="entry-row">
      <rect x="72" y="154" width="500" height="88" rx="12" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.5"/>
      <rect x="72" y="154" width="5" height="88" rx="2.5" fill="#79B3F9"/>
      <text x="92" y="186" font-size="23" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">index.js</text>
      <rect x="238" y="166" width="70" height="26" rx="13" fill="#e7f0fe" stroke="#b9cdf0" stroke-width="1.2"/>
      <text x="273" y="184" text-anchor="middle" font-size="13" fill="#1f4e94">Host 半</text>
      <text x="92" y="220" font-size="18" fill="#42494e">在线心跳 · 会话事件 · 存储与 RPC</text>

      <rect x="628" y="154" width="500" height="88" rx="12" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.5"/>
      <rect x="628" y="154" width="5" height="88" rx="2.5" fill="#4c81c6"/>
      <text x="648" y="186" font-size="23" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">client.js</text>
      <rect x="804" y="166" width="78" height="26" rx="13" fill="#e7f0fe" stroke="#b9cdf0" stroke-width="1.2"/>
      <text x="843" y="184" text-anchor="middle" font-size="13" fill="#1f4e94">Client 半</text>
      <text x="648" y="220" font-size="18" fill="#42494e">侧栏 · 计时浮窗 · 五个仪表盘模块</text>
    </g>

    <!-- 连接线：入口 → 模块层 -->
    <path d="M322 242 V256 M232 270 V256 H543 V270 M878 242 V256 H911 V270"
          fill="none" stroke="#1f4e94" stroke-width="1.5"/>

    <!-- ===== 第三层：模块与挂载点 ===== -->
    <g id="module-row">
      <rect x="72" y="270" width="320" height="100" rx="12" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="88" y="298" font-size="20" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">src/domain/</text>
      <text x="88" y="326" font-size="18" fill="#42494e">领域层 · 8 个模块</text>
      <text x="88" y="352" font-size="18" fill="#606568">自动统计与独立计时</text>

      <rect x="408" y="270" width="270" height="100" rx="12" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="424" y="298" font-size="20" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">src/host/</text>
      <text x="424" y="326" font-size="18" fill="#42494e">Host 适配层 · 6 个模块</text>
      <text x="424" y="352" font-size="18" fill="#606568">RPC、回顾、命令与工具</text>

      <rect x="694" y="270" width="434" height="100" rx="12" fill="none" stroke="#1f4e94" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="712" y="298" font-size="21" font-weight="700" fill="#181a1c">4 个 DSH 挂载点位</text>
      <text x="712" y="327" font-size="18" fill="#42494e"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">sidebar.panellist · shell.overlay</text>
      <text x="712" y="353" font-size="18" fill="#42494e"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">main · settings.section</text>
    </g>

    <!-- ===== 第四层：配套资产 ===== -->
    <g id="support-row">
      <rect x="72" y="394" width="252" height="64" rx="10" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.2"/>
      <text x="88" y="416" font-size="20" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">test/</text>
      <text x="88" y="445" font-size="18" fill="#606568">16 个 node:test 测试文件</text>

      <rect x="340" y="394" width="252" height="64" rx="10" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.2"/>
      <text x="356" y="416" font-size="20" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">docs/adr/</text>
      <text x="356" y="445" font-size="18" fill="#606568">12 篇架构决策记录</text>

      <rect x="608" y="394" width="252" height="64" rx="10" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.2"/>
      <text x="624" y="416" font-size="20" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">locale/</text>
      <text x="624" y="445" font-size="18" fill="#606568">中英展示元数据</text>

      <rect x="876" y="394" width="252" height="64" rx="10" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.2"/>
      <text x="892" y="416" font-size="20" font-weight="700" fill="#181a1c"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">assets/readme/</text>
      <text x="892" y="445" font-size="18" fill="#606568">README 视觉素材</text>
    </g>
  </g>
</svg>
