<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="struct-title struct-desc">
  <title id="struct-title">dsh-timespan bundle 结构树</title>
  <desc id="struct-desc">dsh-timespan 的 bundle 结构：package.json 与 cordis.patch.yml 组成 bundle；index.js 与 client.js 分为 Host、Client 两半；Host 半带 src/domain 领域层七个模块与 src/host 适配层两个模块，Client 半挂载宿主的四个页面点位；配套 test 测试文件、docs/adr 架构决策记录、locale 中英展示元数据与 assets/readme 视觉素材。</desc>

  <rect width="1200" height="480" rx="24" fill="#151718"/>
  <rect x="0.75" y="0.75" width="1198.5" height="478.5" rx="23.25" fill="none" stroke="#2b3033" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- 眉题 -->
    <g transform="translate(72 40)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#303435" stroke-width="2.2"/>
      <g transform="rotate(-90 10 10)">
        <circle cx="10" cy="10" r="8" fill="none" stroke="#3f6ba8" stroke-width="2.2"
                pathLength="100" stroke-dasharray="50 50" stroke-dashoffset="0"/>
        <circle cx="10" cy="10" r="8" fill="none" stroke="#79B3F9" stroke-width="2.2"
                pathLength="100" stroke-dasharray="30 70" stroke-dashoffset="-50"/>
        <circle cx="10" cy="10" r="8" fill="none" stroke="#C29BE8" stroke-width="2.2"
                pathLength="100" stroke-dasharray="20 80" stroke-dashoffset="-80"/>
      </g>
      <text x="28" y="15" font-size="15" letter-spacing="2.2" fill="#8a9090"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">bundle 结构 · @qwayo/dsh-timespan · v0.1.0</text>
    </g>

    <!-- ===== 第一层：bundle 清单 ===== -->
    <g id="root-row">
      <rect x="72" y="66" width="500" height="56" rx="12" fill="#202324" stroke="#414647" stroke-width="1.5"/>
      <text x="88" y="101" font-size="20" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">package.json</text>
      <text x="260" y="100" font-size="15" fill="#b1b6b5">bundle 清单 · exports 与加载方式</text>

      <rect x="628" y="66" width="500" height="56" rx="12" fill="#202324" stroke="#414647" stroke-width="1.5"/>
      <text x="644" y="101" font-size="20" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">cordis.patch.yml</text>
      <text x="852" y="100" font-size="15" fill="#b1b6b5">向 Loader 插入插件行</text>
    </g>

    <!-- 连接线：bundle → 两半 -->
    <path d="M322 122 V136 M878 122 V136 M322 136 H878 M322 136 V154 M878 136 V154"
          fill="none" stroke="#3f6ba8" stroke-width="1.5"/>

    <!-- ===== 第二层：两半入口 ===== -->
    <g id="entry-row">
      <rect x="72" y="154" width="500" height="88" rx="12" fill="#202324" stroke="#414647" stroke-width="1.5"/>
      <rect x="72" y="154" width="5" height="88" rx="2.5" fill="#79B3F9"/>
      <text x="92" y="186" font-size="23" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">index.js</text>
      <rect x="238" y="166" width="70" height="26" rx="13" fill="#182430" stroke="#2e4a66" stroke-width="1.2"/>
      <text x="273" y="184" text-anchor="middle" font-size="13" fill="#8fbfe9">Host 半</text>
      <text x="92" y="220" font-size="15" fill="#b1b6b5">存储域 · 心跳 · 会话事件 · RPC · timespan_stats</text>

      <rect x="628" y="154" width="500" height="88" rx="12" fill="#202324" stroke="#414647" stroke-width="1.5"/>
      <rect x="628" y="154" width="5" height="88" rx="2.5" fill="#a9cffa"/>
      <text x="648" y="186" font-size="23" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">client.js</text>
      <rect x="804" y="166" width="78" height="26" rx="13" fill="#182430" stroke="#2e4a66" stroke-width="1.2"/>
      <text x="843" y="184" text-anchor="middle" font-size="13" fill="#8fbfe9">Client 半</text>
      <text x="648" y="220" font-size="15" fill="#b1b6b5">侧栏 · presence · 概览 / 趋势 / 明细 · 设置</text>
    </g>

    <!-- 连接线：入口 → 模块层 -->
    <path d="M322 242 V258 M878 242 V258 M232 258 H911 M232 258 V270 M543 258 V270 M911 258 V270"
          fill="none" stroke="#3f6ba8" stroke-width="1.5"/>

    <!-- ===== 第三层：模块与挂载点 ===== -->
    <g id="module-row">
      <rect x="72" y="270" width="320" height="92" rx="12" fill="#202324" stroke="#414647" stroke-width="1.5"/>
      <text x="88" y="300" font-size="20" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">src/domain/</text>
      <text x="88" y="324" font-size="16" fill="#b1b6b5">领域层 · 7 个模块</text>
      <text x="88" y="346" font-size="14" fill="#8a9090">纯逻辑，可用假时钟测试</text>

      <rect x="408" y="270" width="270" height="92" rx="12" fill="#202324" stroke="#414647" stroke-width="1.5"/>
      <text x="424" y="300" font-size="20" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">src/host/</text>
      <text x="424" y="324" font-size="16" fill="#b1b6b5">Host 适配层 · 2 个模块</text>
      <text x="424" y="346" font-size="14" fill="#8a9090">包内 RPC 与只读查询工具</text>

      <rect x="694" y="270" width="434" height="92" rx="12" fill="none" stroke="#3f6ba8" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="712" y="300" font-size="19" font-weight="700" fill="#f1f2f1">宿主挂载点位 × 4</text>
      <text x="712" y="326" font-size="15" fill="#b1b6b5"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">sidebar.panellist · shell.overlay</text>
      <text x="712" y="348" font-size="15" fill="#b1b6b5"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">main · settings.section</text>
    </g>

    <!-- ===== 第四层：配套资产 ===== -->
    <g id="support-row">
      <rect x="72" y="386" width="252" height="58" rx="10" fill="#202324" stroke="#414647" stroke-width="1.2"/>
      <text x="88" y="409" font-size="17" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">test/</text>
      <text x="88" y="430" font-size="14" fill="#8a9090">12 个 node:test 测试文件</text>

      <rect x="340" y="386" width="252" height="58" rx="10" fill="#202324" stroke="#414647" stroke-width="1.2"/>
      <text x="356" y="409" font-size="17" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">docs/adr/</text>
      <text x="356" y="430" font-size="14" fill="#8a9090">10 篇架构决策记录</text>

      <rect x="608" y="386" width="252" height="58" rx="10" fill="#202324" stroke="#414647" stroke-width="1.2"/>
      <text x="624" y="409" font-size="17" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">locale/</text>
      <text x="624" y="430" font-size="14" fill="#8a9090">中英展示元数据</text>

      <rect x="876" y="386" width="252" height="58" rx="10" fill="#202324" stroke="#414647" stroke-width="1.2"/>
      <text x="892" y="409" font-size="17" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">assets/readme/</text>
      <text x="892" y="430" font-size="14" fill="#8a9090">README 视觉素材</text>
    </g>
  </g>
</svg>
