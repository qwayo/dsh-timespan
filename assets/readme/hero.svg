<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">dsh-timespan 记录并回顾 DSH 使用时长</title>
  <desc id="hero-desc">记录在线、活跃与任务时长，提供独立的正计时、倒计时与按需生成的时间回顾。右侧以 TimeSpan 标识为基础示意三种时长的构成。</desc>

  <!-- 画布：白色背景与浅色边框 -->
  <rect width="1200" height="360" rx="24" fill="#ffffff"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23.25" fill="none" stroke="#dedfdd" stroke-width="1.5"/>

  <!-- 左侧标题区 -->
  <g id="title-block">
    <g transform="translate(72 54)">
      <g transform="translate(0 -2)" fill="none" stroke-width="2.2" stroke-linecap="round">
        <path d="M3.69 10.23 A8.5 8.5 0 0 1 20.31 10.23" stroke="#1f4e94"/>
        <path d="M20.31 13.77 A8.5 8.5 0 0 1 13.77 20.31" stroke="#C29BE8"/>
        <path d="M10.23 20.31 A8.5 8.5 0 0 1 3.69 13.77" stroke="#79b3f9"/>
        <path d="M12 12l4-4" stroke="#133463" stroke-width="2"/>
        <circle cx="12" cy="12" r="1.8" fill="#133463" stroke="none"/>
      </g>
      <text x="27" y="15" font-size="17" letter-spacing="2.8" fill="#606568"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">DSH 插件 · 时长统计</text>
    </g>

    <text x="70" y="162" font-size="74" font-weight="700" letter-spacing="-1" fill="#181a1c"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">dsh-timespan</text>

    <text x="72" y="210" font-size="24" fill="#42494e"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">记录 DSH 的在线、活跃与任务时长，数据只留在本机</text>

    <!-- 元数据胶囊 -->
    <g id="meta-chips" font-size="15" fill="#42494e"
       font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">
      <rect x="72" y="244" width="68" height="30" rx="15" fill="none" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="106" y="264" text-anchor="middle">零依赖</text>
      <rect x="152" y="244" width="68" height="30" rx="15" fill="none" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="186" y="264" text-anchor="middle">无构建</text>
      <rect x="232" y="244" width="76" height="30" rx="15" fill="none" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="270" y="264" text-anchor="middle">本地存储</text>
      <rect x="320" y="244" width="86" height="30" rx="15" fill="none" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="363" y="264" text-anchor="middle">Node 24+</text>
    </g>
  </g>

  <!-- 右侧：今日构成环（三段之间留空隙，任务段为紫色） -->
  <g id="composite-ring">
    <g transform="rotate(-90 900 178)" stroke-linecap="round">
      <!-- 三段之间保留约 2.2% 的可见空隙，圆头端帽让分界处呈半圆 -->
      <!-- 在线：51.5%，两侧各让出 1.1% -->
      <circle cx="900" cy="178" r="100" fill="none" stroke="#1f4e94" stroke-width="26"
              pathLength="100" stroke-dasharray="45.16 54.84" stroke-dashoffset="-3.17"/>
      <!-- 活跃：28.5%，两侧各让出 1.1% -->
      <circle cx="900" cy="178" r="100" fill="none" stroke="#79B3F9" stroke-width="26"
              pathLength="100" stroke-dasharray="22.16 77.84" stroke-dashoffset="-54.67"/>
      <!-- 任务：20%，两侧各让出 1.1%，紫色 -->
      <circle cx="900" cy="178" r="100" fill="none" stroke="#C29BE8" stroke-width="26"
              pathLength="100" stroke-dasharray="13.66 86.34" stroke-dashoffset="-83.17"/>
    </g>

    <!-- 指针与轴心 -->
    <path d="M900 178 952 126" fill="none" stroke="#133463" stroke-width="6" stroke-linecap="round"/>
    <circle cx="900" cy="178" r="10" fill="#133463"/>

    <!-- 分段标注 -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22">
      <g id="label-online">
        <path d="M1004 185 1029 195" stroke="#c3cad4" stroke-width="1.5" fill="none"/>
        <circle cx="1038" cy="199" r="4.5" fill="#1f4e94"/>
        <text x="1050" y="206" fill="#42494e">在线</text>
      </g>
      <g id="label-active">
        <path d="M809 223 780 247" stroke="#c3cad4" stroke-width="1.5" fill="none"/>
        <circle cx="772" cy="253" r="4.5" fill="#79B3F9"/>
        <text x="760" y="260" text-anchor="end" fill="#42494e">活跃</text>
      </g>
      <g id="label-task">
        <path d="M847 100 824 81" stroke="#c3cad4" stroke-width="1.5" fill="none"/>
        <circle cx="816" cy="75" r="4.5" fill="#C29BE8"/>
        <text x="804" y="82" text-anchor="end" fill="#42494e">任务</text>
      </g>
    </g>
  </g>
</svg>
