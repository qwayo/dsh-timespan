<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">dsh-timespan 运行机制</title>
  <desc id="arch-desc">dsh-timespan 分成两半：Host 是随 DSH 一起运行的后台，负责记在线心跳、听会话事件、统一计算统计、写入本机存储并注册 timespan_stats 只读工具；Client 是页面上看到的部分，负责侧栏入口、presence 心跳、概览/趋势/明细与设置页，只把发生了什么报给后台。</desc>

  <rect width="1200" height="440" rx="24" fill="#151718"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="23.25" fill="none" stroke="#2b3033" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- 眉题 -->
    <g transform="translate(72 42)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#303435" stroke-width="2.2"/>
      <g transform="rotate(-90 10 10)">
        <circle cx="10" cy="10" r="8" fill="none" stroke="#3f6ba8" stroke-width="2.2"
                pathLength="100" stroke-dasharray="50 50" stroke-dashoffset="0"/>
        <circle cx="10" cy="10" r="8" fill="none" stroke="#79B3F9" stroke-width="2.2"
                pathLength="100" stroke-dasharray="30 70" stroke-dashoffset="-50"/>
        <circle cx="10" cy="10" r="8" fill="none" stroke="#C29BE8" stroke-width="2.2"
                pathLength="100" stroke-dasharray="20 80" stroke-dashoffset="-80"/>
      </g>
      <text x="28" y="15" font-size="15" letter-spacing="2.4" fill="#8a9090"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">运行机制 · HOST + CLIENT</text>
    </g>

    <!-- ===== 后台：DSH Host ===== -->
    <g id="host-box">
      <rect x="72" y="70" width="1056" height="132" rx="16" fill="#202324" stroke="#414647" stroke-width="1.5"/>
      <circle cx="98" cy="101" r="7" fill="#79B3F9"/>
      <text x="116" y="110" font-size="25" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">DSH Host</text>
      <text x="252" y="109" font-size="18" fill="#8a9090">随 DSH 一起运行的后台，统计只在这里计算</text>

      <g font-size="18" fill="#b1b6b5" text-anchor="middle">
        <rect x="96" y="136" width="184" height="40" rx="20" fill="#303435"/>
        <text x="188" y="161">30 秒在线心跳</text>
        <rect x="292" y="136" width="190" height="40" rx="20" fill="#303435"/>
        <text x="387" y="161">监听会话事件</text>
        <rect x="494" y="136" width="166" height="40" rx="20" fill="#303435"/>
        <text x="577" y="161">统一计算口径</text>
        <rect x="672" y="136" width="214" height="40" rx="20" fill="#303435"/>
        <text x="779" y="161">写入本机 · 不上传</text>
        <rect x="898" y="136" width="206" height="40" rx="20" fill="#303435"/>
        <text x="1001" y="161">注册 timespan_stats 工具</text>
      </g>
    </g>

    <!-- ===== 双向通道 ===== -->
    <g id="channel">
      <line x1="300" y1="274" x2="300" y2="210" stroke="#79B3F9" stroke-width="2"/>
      <path d="M294 216 300 206 306 216" fill="none" stroke="#79B3F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="322" y="242" font-size="16" fill="#b1b6b5">上报事实：可见、聚焦、任务起止</text>

      <line x1="790" y1="208" x2="790" y2="274" stroke="#a9cffa" stroke-width="2"/>
      <path d="M784 268 790 278 796 268" fill="none" stroke="#a9cffa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="812" y="242" font-size="16" fill="#b1b6b5">返回结果：与 timespan_stats 同源</text>

      <rect x="598" y="221" width="140" height="28" rx="14" fill="#182430" stroke="#2e4a66" stroke-width="1"/>
      <text x="668" y="240" text-anchor="middle" font-size="12" fill="#8fbfe9"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">包内 RPC</text>
    </g>

    <!-- ===== 页面：DSH Web Client ===== -->
    <g id="client-box">
      <rect x="72" y="278" width="1056" height="112" rx="16" fill="#202324" stroke="#414647" stroke-width="1.5"/>
      <circle cx="98" cy="309" r="7" fill="#a9cffa"/>
      <text x="116" y="318" font-size="25" font-weight="700" fill="#f1f2f1"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">DSH Web Client</text>
      <text x="338" y="317" font-size="18" fill="#8a9090">你在页面上看到的部分，只负责上报事实与展示结果</text>

      <g font-size="18" fill="#b1b6b5" text-anchor="middle">
        <rect x="96" y="334" width="214" height="36" rx="18" fill="#303435"/>
        <text x="203" y="357">侧栏入口 · 今日在线</text>
        <rect x="322" y="334" width="190" height="36" rx="18" fill="#303435"/>
        <text x="417" y="357">每 15 秒 presence</text>
        <rect x="524" y="334" width="198" height="36" rx="18" fill="#303435"/>
        <text x="623" y="357">概览 / 趋势 / 明细</text>
        <rect x="734" y="334" width="214" height="36" rx="18" fill="#303435"/>
        <text x="841" y="357">设置与配色仅存本机</text>
      </g>
    </g>

    <text x="600" y="426" text-anchor="middle" font-size="18" fill="#b1b6b5">页面只负责上报事实；怎么算、算多久、存在哪，都由 Host 统一处理，数据不出本机。</text>
  </g>
</svg>
