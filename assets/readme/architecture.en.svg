<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1200" height="506" viewBox="0 0 1200 506" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How dsh-timespan works</title>
  <desc id="arch-desc">The DSH Host records its own heartbeat and session events, computes and stores statistics, maintains a separate manual timer and serves the read-only timespan_stats tool. The Web Client reports presence and sends requests over the plugin RPC. To generate a review, the Host sends statistics and session material from the selected range through the configured Provider and model.</desc>

  <rect width="1200" height="506" rx="24" fill="#fff"/>
  <rect x="0.75" y="0.75" width="1198.5" height="504.5" rx="23.25" fill="none" stroke="#dedfdd" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(72 41)">
      <g transform="translate(0 -2)" fill="none" stroke-width="2.2" stroke-linecap="round">
        <path d="M3.69 10.23 A8.5 8.5 0 0 1 20.31 10.23" stroke="#1f4e94"/>
        <path d="M20.31 13.77 A8.5 8.5 0 0 1 13.77 20.31" stroke="#7a5aa6"/>
        <path d="M10.23 20.31 A8.5 8.5 0 0 1 3.69 13.77" stroke="#79b3f9"/>
        <path d="M12 12l4-4" stroke="#133463" stroke-width="2"/>
        <circle cx="12" cy="12" r="1.8" fill="#133463" stroke="none"/>
      </g>
      <text x="34" y="19" font-size="30" font-weight="700" fill="#181a1c">How it works</text>
    </g>

    <g id="host-box">
      <rect x="72" y="83" width="1056" height="130" rx="16" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.5"/>
      <circle cx="98" cy="117" r="7" fill="#79b3f9"/>
      <text x="116" y="126" font-size="27" font-weight="700" fill="#181a1c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">DSH Host</text>
      <text x="280" y="125" font-size="21" fill="#606568">Processes and stores time records</text>
      <g font-size="20" fill="#42494e" text-anchor="middle">
        <rect x="96" y="148" width="252" height="44" rx="22" fill="#eaecee"/>
        <text x="222" y="177">30s heartbeat and events</text>
        <rect x="360" y="148" width="248" height="44" rx="22" fill="#eaecee"/>
        <text x="484" y="177">Stats and local storage</text>
        <rect x="620" y="148" width="230" height="44" rx="22" fill="#eaecee"/>
        <text x="735" y="177">Separate manual timer</text>
        <rect x="862" y="148" width="242" height="44" rx="22" fill="#eaecee"/>
        <text x="983" y="177">Read-only timespan_stats</text>
      </g>
    </g>

    <g id="channel">
      <path d="M102 277V222m-5 6 5-6 5 6" fill="none" stroke="#4c81c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="126" y="256" font-size="20" fill="#42494e">Presence, timer and review requests</text>
      <rect x="513" y="234" width="174" height="34" rx="17" fill="#e7f0fe" stroke="#b9cdf0"/>
      <text x="600" y="257" font-size="20" font-weight="600" text-anchor="middle" fill="#1f4e94">Plugin RPC</text>
      <path d="M748 222v55m-5-6 5 6 5-6" fill="none" stroke="#4c81c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="772" y="256" font-size="20" fill="#42494e">Stats, timer state and reports</text>
    </g>

    <g id="client-box">
      <rect x="72" y="286" width="1056" height="130" rx="16" fill="#f7f8f9" stroke="#c3cad4" stroke-width="1.5"/>
      <circle cx="98" cy="321" r="7" fill="#4c81c6"/>
      <text x="116" y="330" font-size="27" font-weight="700" fill="#181a1c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">DSH Web Client</text>
      <text x="365" y="329" font-size="21" fill="#606568">Reports presence every 15 seconds</text>
      <g font-size="21" fill="#42494e" text-anchor="middle">
        <rect x="96" y="352" width="192" height="44" rx="22" fill="#eaecee"/>
        <text x="192" y="381">Sidebar entry</text>
        <rect x="300" y="352" width="192" height="44" rx="22" fill="#eaecee"/>
        <text x="396" y="381">Floating timer</text>
        <rect x="504" y="352" width="600" height="44" rx="22" fill="#eaecee"/>
        <text x="804" y="381">Overview · Trend · Sessions · Review · Settings</text>
      </g>
    </g>

    <g id="review-path">
      <circle cx="99" cy="445" r="6" fill="#7a5aa6"/>
      <text x="116" y="452" font-size="22" font-weight="700" fill="#382555">On-demand review</text>
      <text x="358" y="452" font-size="21" fill="#42494e">Uses the separately selected Provider and model</text>
      <text x="358" y="479" font-size="20" fill="#606568">Sends statistics and session material from the selected range</text>
    </g>
  </g>
</svg>
