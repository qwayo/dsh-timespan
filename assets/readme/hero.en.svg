<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">dsh-timespan for DSH time tracking and review</title>
  <desc id="hero-desc">Tracks online, active and task time, with a separate stopwatch and countdown and on-demand time reviews. The three-segment illustration is based on the TimeSpan icon.</desc>

  <!-- Canvas: white background with a light border -->
  <rect width="1200" height="360" rx="24" fill="#ffffff"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23.25" fill="none" stroke="#dedfdd" stroke-width="1.5"/>

  <!-- Left: title block -->
  <g id="title-block">
    <g transform="translate(72 54)">
      <g transform="translate(0 -2)" fill="none" stroke-width="2.2" stroke-linecap="round">
        <path d="M3.69 10.23 A8.5 8.5 0 0 1 20.31 10.23" stroke="#1f4e94"/>
        <path d="M20.31 13.77 A8.5 8.5 0 0 1 13.77 20.31" stroke="#C29BE8"/>
        <path d="M10.23 20.31 A8.5 8.5 0 0 1 3.69 13.77" stroke="#79b3f9"/>
        <path d="M12 12l4-4" stroke="#133463" stroke-width="2"/>
        <circle cx="12" cy="12" r="1.8" fill="#133463" stroke="none"/>
      </g>
      <text x="27" y="15" font-size="17" letter-spacing="2.8" fill="#606568"
            font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">DSH PLUGIN · TIME TRACKING</text>
    </g>

    <text x="70" y="154" font-size="74" font-weight="700" letter-spacing="-1" fill="#181a1c"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">dsh-timespan</text>

    <g fill="#42494e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="72" y="208" font-size="29">Track online, active and task time in DSH</text>
      <text x="72" y="245" font-size="25">Stopwatch, countdown and on-demand reviews</text>
    </g>

    <!-- Metadata chips -->
    <g id="meta-chips" font-size="16" fill="#42494e"
       font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">
      <rect x="72" y="280" width="105" height="33" rx="16.5" fill="none" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="124.5" y="301" text-anchor="middle">Zero deps</text>
      <rect x="189" y="280" width="96" height="33" rx="16.5" fill="none" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="237" y="301" text-anchor="middle">No build</text>
      <rect x="297" y="280" width="142" height="33" rx="16.5" fill="none" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="368" y="301" text-anchor="middle">Local storage</text>
      <rect x="451" y="280" width="110" height="33" rx="16.5" fill="none" stroke="#c3cad4" stroke-width="1.5"/>
      <text x="506" y="301" text-anchor="middle">Node 24+</text>
    </g>
  </g>

  <!-- Right: today's ring (gap between segments, task segment in purple) -->
  <g id="composite-ring">
    <g transform="rotate(-90 900 178)" stroke-linecap="round">
      <!-- Keep a ~2.2% visible gap at each boundary; round caps give each segment a semicircular end -->
      <!-- Online: 51.5%, 1.1% given up on both sides -->
      <circle cx="900" cy="178" r="100" fill="none" stroke="#1f4e94" stroke-width="26"
              pathLength="100" stroke-dasharray="45.16 54.84" stroke-dashoffset="-3.17"/>
      <!-- Active: 28.5%, 1.1% at the start and another 1.1% at the end -->
      <circle cx="900" cy="178" r="100" fill="none" stroke="#79B3F9" stroke-width="26"
              pathLength="100" stroke-dasharray="22.16 77.84" stroke-dashoffset="-54.67"/>
      <!-- Task: 20%, 1.1% on both sides, purple -->
      <circle cx="900" cy="178" r="100" fill="none" stroke="#C29BE8" stroke-width="26"
              pathLength="100" stroke-dasharray="13.66 86.34" stroke-dashoffset="-83.17"/>
    </g>

    <!-- Needle and hub -->
    <path d="M900 178 952 126" fill="none" stroke="#133463" stroke-width="6" stroke-linecap="round"/>
    <circle cx="900" cy="178" r="10" fill="#133463"/>

    <!-- Segment labels -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22">
      <g id="label-online">
        <path d="M1004 185 1029 195" stroke="#c3cad4" stroke-width="1.5" fill="none"/>
        <circle cx="1038" cy="199" r="4.5" fill="#1f4e94"/>
        <text x="1050" y="206" fill="#42494e">Online</text>
      </g>
      <g id="label-active">
        <path d="M803 228 780 247" stroke="#c3cad4" stroke-width="1.5" fill="none"/>
        <circle cx="772" cy="253" r="4.5" fill="#79B3F9"/>
        <text x="760" y="260" text-anchor="end" fill="#42494e">Active</text>
      </g>
      <g id="label-task">
        <path d="M847 100 824 81" stroke="#c3cad4" stroke-width="1.5" fill="none"/>
        <circle cx="816" cy="75" r="4.5" fill="#C29BE8"/>
        <text x="804" y="82" text-anchor="end" fill="#42494e">Task</text>
      </g>
    </g>

    <text x="900" y="332" text-anchor="middle"
          font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace"
          font-size="19" fill="#606568">Illustrative time breakdown</text>
  </g>
</svg>
